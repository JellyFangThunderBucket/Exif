server {
  listen 443 ssl http2;
  server_name metadata.example.com;
  ssl_certificate /etc/letsencrypt/live/metadata.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/metadata.example.com/privkey.pem;
  auth_basic "Metadata Lab";
  auth_basic_user_file /etc/nginx/.metadata-lab.htpasswd;
  client_max_body_size 100m;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
